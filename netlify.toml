# Netlify detects Next.js and runs it with its Next.js runtime (OpenNext adapter).
# Production uses PostgreSQL: the build turns prisma/schema.prisma (SQLite, local dev)
# into prisma/postgres.prisma, generates the client for it and syncs the tables.
[build]
  command = "node scripts/postgres-schema.mjs && npx prisma generate --schema prisma/postgres.prisma && npx prisma db push --schema prisma/postgres.prisma --skip-generate && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
